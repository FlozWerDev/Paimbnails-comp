name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "v*"

jobs:
  build:
    name: Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # With combine: true the action uploads the unfinished per-target binary
      # itself; the package job merges them into the final .geode.
      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: actions/checkout@v4

      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}

  build-installer:
    name: Build Windows Installer
    runs-on: windows-latest
    needs: package

    steps:
      - uses: actions/checkout@v4

      - name: Download combined build
        uses: actions/download-artifact@v4
        with:
          name: Build Output
          path: build

      - name: Prepare .geode for installer
        run: |
          $file = Get-ChildItem -Path build -Filter "*.geode" | Select-Object -First 1
          if ($file.Name -ne "flozwer.paimbnails2.geode") {
            Copy-Item $file.FullName -Destination "build\flozwer.paimbnails2.geode" -Force
          }

      - name: Install NSIS
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Build NSIS installer
        run: |
          cd installer
          & "C:\Program Files (x86)\NSIS\makensis.exe" /V4 installer.nsi

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Paimbnails-Windows-Installer
          path: installer\Paimbnails-Installer.exe

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: ['package', 'build-installer']
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # Download the finished artifacts by name. Downloading everything would
      # also pull the per-target geode-build-* artifacts, which hold unfinished
      # binaries meant only for the combine step.
      - name: Download combined .geode
        uses: actions/download-artifact@v4
        with:
          name: Build Output
          path: release

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: Paimbnails-Windows-Installer
          path: release

      - name: Build release notes
        run: |
          {
            echo "## Descargas"
            echo ""
            echo "- \`flozwer.paimbnails2.geode\` — instalalo desde Geode, o copialo a la carpeta \`geode/mods\`."
            echo "- \`Paimbnails-Installer.exe\` — instalador para Windows."
            echo ""
          } > notes.md
          # Top changelog section, with the Geode colour and image markup
          # stripped. Its heading is dropped since the release title repeats it.
          awk 'NR == 1 {next} /^# /{exit} {print}' changelog.md \
            | sed -E 's/<c[a-z]>//g; s|</c>||g; s/!\[\]\([^)]*\)//g' >> notes.md

      - name: List release files
        run: ls -lh release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Paimbnails ${{ github.ref_name }}
          body_path: notes.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: release/*
